# Reply follows the conversation's language. A generated document uses "default", except paths listed in "exceptions".
language:
  default: en_US
  exceptions:
    - id: specsfy_specs
      paths:
        - specs/**/spec.md
      language: pt_BR
      reason: validadores do Specsfy (validate_spec.mjs, verify_acceptance.mjs) fazem
        parsing de títulos de seção em português
    - id: specsfy_docs_managed_block
      paths:
        - docs/**/*.md
      language: pt_BR
      reason: build_documentation.mjs gera o bloco gerenciado (<!--
        specsfy:documentator:start/end -->) com prosa em português fixa no
        próprio script; --check falha se divergir
# Project stack metadata. Synced automatically from .specsfy/STACK.md when Specsfy is active — don't hand-edit these fields in that case.
project:
  prog_lang: "TypeScript"
  runtime: "Node.js"
  package_manager: ""
  framework: ""
  test_framework: "Vitest"
  documentation_style: ""
# Machine/environment profile. "os" is auto-detected; the rest can be filled by asking the agent to interview you.
system:
  os: linux
  distro: ""
  ram_gb: null
  cpu: ""
  gpu: ""
  baremetal: null
  container: null
# Controls what this project ignores in git. "default" applies to any group without an explicit "ignored".
git:
  default: ignored
  groups:
    common_rules_config:
      description: O próprio config.yaml — compartilhado pelo time por padrão
      paths:
        - .common-rules/config.yaml
      ignored: false
    common_rules_state:
      description: Estado operacional do common-rules (install.json, extensions.json,
        quarantine/)
      paths:
        - .common-rules/install.json
        - .common-rules/extensions.json
        - .common-rules/quarantine/
      ignored: true
    specsfy:
      description: Artefatos do Specsfy — já tratados como fonte normativa versionada
        pelo próprio contrato do framework
      paths:
        - .specsfy/
        - specs/
        - PROJECT.md
        - INTERFACE.md
        - DESIGNSYSTEM.MD
      ignored: false
    installed_skills:
      description: Skills entregues por common-rules, mattpocock ou Specsfy —
        reinstaláveis, como dependências
      paths:
        - .claude/skills/
        - .agents/skills/
      ignored: true
    code_review_graph:
      description: Saída de análise do code-review-graph — caminho ainda não
        inspecionado neste projeto
      paths: []
      ignored: true
    context_mode:
      description: Estado de sessão/uso de contexto do context-mode — caminho ainda
        não inspecionado neste projeto
      paths: []
      ignored: true
